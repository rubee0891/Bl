<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0d0d18">
<meta name="apple-mobile-web-app-title" content="BL Collabs">
<link rel="manifest" href="data:application/json,%7B%22name%22%3A%20%22BL%20Collabs%22%2C%20%22short_name%22%3A%20%22BL%20Collabs%22%2C%20%22start_url%22%3A%20%22./%22%2C%20%22display%22%3A%20%22standalone%22%2C%20%22background_color%22%3A%20%22%230d0d18%22%2C%20%22theme_color%22%3A%20%22%230d0d18%22%2C%20%22orientation%22%3A%20%22portrait%22%2C%20%22icons%22%3A%20%5B%7B%22src%22%3A%20%22data%3Aimage/svg%2Bxml%2C%3Csvg%20xmlns%3D%27http%3A//www.w3.org/2000/svg%27%20viewBox%3D%270%200%20100%20100%27%3E%3Crect%20width%3D%27100%27%20height%3D%27100%27%20rx%3D%2720%27%20fill%3D%27%230d0d18%27/%3E%3Ctext%20y%3D%27.9em%27%20font-size%3D%2775%27%3E%5Cud83c%5Cudfaa%3C/text%3E%3C/svg%3E%22%2C%20%22sizes%22%3A%20%22512x512%22%2C%20%22type%22%3A%20%22image/svg%2Bxml%22%2C%20%22purpose%22%3A%20%22any%20maskable%22%7D%5D%7D">
<title>🎪 BL Collabs</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0d0d18;--bg2:#13132a;--surface:#1a1a32;--surface2:#21213e;
  --border:#ffffff10;--border2:#ffffff1c;
  --text:#ede8ff;--muted:#6b6898;
  --pink:#f472b6;--purple:#c084fc;--grad:linear-gradient(135deg,#c084fc,#f472b6);
  --green:#34d399;--gold:#fbbf24;--red:#f87171;--cyan:#22d3ee;--orange:#f97316;
  --safe-b:env(safe-area-inset-bottom,0px);--safe-t:env(safe-area-inset-top,0px);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:'Outfit',sans-serif;background:var(--bg);color:var(--text);min-height:100dvh;overflow-x:hidden}
input,select,textarea,button{font-family:'Outfit',sans-serif}

/* HEADER */
.header{background:linear-gradient(180deg,#0c0c1e,#0d0d1888);backdrop-filter:blur(20px);border-bottom:1px solid var(--border);padding:calc(14px + var(--safe-t)) 16px 0;position:sticky;top:0;z-index:100}
.header-row{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.logo{width:38px;height:38px;border-radius:10px;background:var(--grad);display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0}
.header-title{font-family:'Playfair Display',serif;font-size:20px;color:#fff;line-height:1}
.header-sub{font-size:11px;color:var(--muted);margin-top:3px}
.tabs{display:flex;overflow-x:auto;scrollbar-width:none;gap:2px}
.tabs::-webkit-scrollbar{display:none}
.tab-btn{flex-shrink:0;background:none;border:none;color:var(--muted);padding:10px 13px;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;cursor:pointer;border-bottom:2px solid transparent;transition:all .15s;white-space:nowrap}
.tab-btn.active{color:var(--purple);border-bottom-color:var(--purple)}

/* LAYOUT */
.content{padding:16px 14px calc(24px + var(--safe-b));max-width:700px;margin:0 auto}
.tab-panel{display:none;animation:fadeUp .2s ease}
.tab-panel.active{display:block}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}

/* INPUTS */
input[type=text],input[type=url],input[type=date],input[type=number],select,textarea{
  background:var(--surface2);border:1px solid var(--border);color:var(--text);
  padding:11px 13px;border-radius:11px;font-size:13px;outline:none;width:100%;transition:border-color .15s
}
input:focus,select:focus,textarea:focus{border-color:#c084fc44}
input::placeholder,textarea::placeholder{color:var(--muted)}
textarea{resize:vertical;min-height:72px}
select option{background:#21213e}
input[type=file]{display:none}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:400px){.row2{grid-template-columns:1fr}}

/* FIELD */
.field{display:flex;flex-direction:column;gap:5px;width:100%}
.field label{font-size:10px;color:var(--muted);font-weight:700;letter-spacing:.07em;text-transform:uppercase}

/* BUTTONS */
.btn-primary{background:var(--grad);color:#fff;border:none;padding:13px;border-radius:13px;font-weight:800;font-size:14px;cursor:pointer;width:100%;transition:opacity .15s}
.btn-primary:active{opacity:.85}
.btn-sm{padding:7px 13px;border-radius:9px;font-size:11px;font-weight:700;cursor:pointer;border:none;transition:opacity .15s}
.btn-sm:active{opacity:.75}
.btn-sm.purple{background:#c084fc18;color:var(--purple);border:1px solid #c084fc30}
.btn-sm.cyan{background:#22d3ee18;color:var(--cyan);border:1px solid #22d3ee30}
.btn-sm.danger{background:#f8717118;color:var(--red);border:1px solid #f8717130}
.btn-sm.gold{background:#fbbf2418;color:var(--gold);border:1px solid #fbbf2430}
.btn-icon{background:var(--surface2);border:1px solid var(--border);color:#ccc;width:30px;height:30px;border-radius:8px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0}
.btn-icon.danger{color:var(--red)}

/* SECTION */
.sdiv{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;font-weight:700;margin:16px 0 10px;display:flex;align-items:center;gap:10px}
.sdiv::after{content:'';flex:1;height:1px;background:var(--border)}
.section-title{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin:18px 0 10px;font-weight:700;display:flex;align-items:center;gap:10px}
.section-title::after{content:'';flex:1;height:1px;background:var(--border)}

/* SERIES TAG INPUT */
.series-input-wrap{display:flex;gap:8px;align-items:center}
.series-tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;min-height:10px}
.serie-tag{display:inline-flex;align-items:center;gap:6px;background:#c084fc22;border:1px solid #c084fc44;border-radius:20px;padding:4px 10px 4px 12px;font-size:12px;font-weight:700;color:var(--purple)}
.serie-tag button{background:none;border:none;color:#c084fc88;cursor:pointer;font-size:14px;line-height:1;padding:0}
.serie-tag button:hover{color:var(--red)}

/* COLLAB CARD */
.collab-card{background:var(--surface);border:1px solid var(--border);border-radius:16px;overflow:hidden;margin-bottom:12px;transition:border-color .15s}
.collab-card:hover{border-color:#c084fc33}
.collab-header{padding:14px 15px 10px}
.collab-name{font-family:'Playfair Display',serif;font-size:18px;color:#fff;line-height:1.2;margin-bottom:6px}
.collab-series{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:8px}
.collab-series .stag{background:#c084fc18;border:1px solid #c084fc33;border-radius:12px;padding:2px 9px;font-size:11px;font-weight:700;color:var(--purple)}
.meta-row{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:8px}
.meta-chip{display:inline-flex;align-items:center;gap:5px;background:var(--bg2);border-radius:8px;padding:4px 9px;font-size:11px;color:var(--muted)}
.meta-chip span{color:var(--text);font-weight:600}
.status-badge{display:inline-flex;align-items:center;padding:3px 10px;border-radius:20px;font-size:10px;font-weight:800;letter-spacing:.04em}
.collab-footer{padding:8px 15px 12px;display:flex;gap:8px;border-top:1px solid var(--border);flex-wrap:wrap}

/* STATS */
.stats-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:20px}
.stat-card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px;position:relative;overflow:hidden}
.stat-card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:var(--accent,var(--grad))}
.stat-label{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin-bottom:6px;font-weight:700}
.stat-value{font-family:'Playfair Display',serif;font-size:28px;color:#fff}
.stat-sub{font-size:11px;color:var(--muted);margin-top:2px}

/* RANKING */
.rank-row{background:var(--surface);border-radius:12px;padding:11px 14px;display:flex;align-items:center;gap:12px;margin-bottom:7px}
.rank-num{font-family:'Playfair Display',serif;font-size:18px;width:28px;flex-shrink:0;text-align:center}
.rank-name{font-weight:800;font-size:14px;color:#fff;flex:1}
.rank-bar-wrap{flex:1;height:6px;background:var(--bg2);border-radius:3px;overflow:hidden}
.rank-bar{height:100%;border-radius:3px;background:var(--grad);transition:width .5s ease}
.rank-count{font-size:12px;font-weight:700;color:var(--purple);min-width:32px;text-align:right}
.rank-orgas{font-size:10px;color:var(--muted);margin-top:2px}

/* TYPE CHART */
.type-row{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.type-label{font-size:12px;color:var(--text);width:120px;flex-shrink:0}
.type-bar-wrap{flex:1;height:8px;background:var(--bg2);border-radius:4px;overflow:hidden}
.type-bar{height:100%;border-radius:4px;transition:width .5s}
.type-count{font-size:11px;color:var(--muted);min-width:24px;text-align:right}

/* TIMELINE */
.timeline-row{display:flex;gap:10px;align-items:flex-start;margin-bottom:10px}
.tl-dot{width:10px;height:10px;border-radius:50%;background:var(--purple);flex-shrink:0;margin-top:4px}
.tl-body{flex:1}
.tl-name{font-weight:700;font-size:13px;color:#fff}
.tl-meta{font-size:11px;color:var(--muted);margin-top:2px}
.tl-series{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}

/* EMPTY */
.empty{text-align:center;padding:60px 20px;color:var(--muted)}
.empty-icon{font-size:48px;margin-bottom:14px}

/* TOAST */
.toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%);background:var(--surface2);border:1px solid var(--border2);color:var(--text);padding:10px 20px;border-radius:20px;font-size:13px;font-weight:700;z-index:999;white-space:nowrap;box-shadow:0 6px 24px #0009;animation:toastPop .2s ease;pointer-events:none;display:none}
@keyframes toastPop{from{opacity:0;transform:translateX(-50%) translateY(8px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}
</style>
</head>
<body>

<header class="header">
  <div class="header-row">
    <div class="logo">🎪</div>
    <div>
      <div class="header-title">BL Collabs</div>
      <div class="header-sub" id="hdr-sub">Chargement…</div>
    </div>
  </div>
  <div class="tabs">
    <button class="tab-btn active" data-tab="liste">🎪 Collabs</button>
    <button class="tab-btn" data-tab="form">＋ Ajouter</button>
    <button class="tab-btn" data-tab="stats">📊 Stats</button>
  </div>
</header>

<main class="content">

  <!-- ══════════════════
       LISTE COLLABS
  ═══════════════════ -->
  <div id="tab-liste" class="tab-panel active">

    <div style="display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap">
      <input type="text" id="s-search" placeholder="🔍 Série, nom, lieu…" oninput="renderListe()" style="flex:2;min-width:140px">
      <select id="s-type" onchange="renderListe()" style="flex:1;min-width:100px">
        <option value="">Tous types</option>
        <option>Pop-up</option><option>Café collab</option><option>Event en ligne</option>
        <option>Vente physique</option><option>Festival</option><option>Autre</option>
      </select>
    </div>
    <div style="display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap">
      <select id="s-statut" onchange="renderListe()" style="flex:1;min-width:100px">
        <option value="">Tous statuts</option>
        <option>À venir</option><option>En cours</option><option>Passé</option>
        <option>Annulé</option><option>Manqué</option>
      </select>
      <select id="s-pays" onchange="renderListe()" style="flex:1;min-width:100px">
        <option value="">Tous pays</option>
      </select>
      <select id="s-sort" onchange="renderListe()" style="flex:1;min-width:100px">
        <option value="date_desc">📅 Plus récent</option>
        <option value="date_asc">📅 Plus ancien</option>
        <option value="alpha">🔤 A–Z</option>
      </select>
    </div>
    <div style="display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap">
      <button class="btn-sm purple" onclick="exportJSON()" style="flex:1">⬇️ JSON</button>
      <button class="btn-sm purple" onclick="document.getElementById('imp-json').click()" style="flex:1">⬆️ JSON</button>
      <input type="file" id="imp-json" accept=".json" onchange="importJSON(this)">
      <button class="btn-sm cyan" onclick="exportCSV()" style="flex:1">⬇️ CSV</button>
      <button class="btn-sm cyan" onclick="document.getElementById('imp-csv').click()" style="flex:1">⬆️ CSV</button>
      <input type="file" id="imp-csv" accept=".csv" onchange="importCSV(this)">
    </div>
    <div id="liste-content"></div>
  </div>

  <!-- ══════════════════
       FORMULAIRE
  ═══════════════════ -->
  <div id="tab-form" class="tab-panel">
    <div style="font-family:'Playfair Display',serif;font-size:22px;color:#fff;margin-bottom:18px" id="form-title">Nouvelle Collab</div>
    <input type="hidden" id="f-id">
    <div style="display:grid;gap:12px;max-width:560px">

      <div class="row2">
        <div class="field"><label>Nom de la collab *</label><input type="text" id="f-nom" placeholder="Pop-up Toonique, Mofun…"></div>
        <div class="field"><label>Organisateur</label><input type="text" id="f-orga" placeholder="Toonique, Mofun, Fantazit…"></div>
      </div>

      <!-- SÉRIES : saisie multiple -->
      <div class="field">
        <label>Séries / Manhwa associées *</label>
        <div class="series-input-wrap">
          <input type="text" id="f-serie-input" placeholder="Taper une série et appuyer sur ＋" style="flex:1"
            onkeydown="if(event.key==='Enter'){event.preventDefault();addSerie()}">
          <button class="btn-icon" onclick="addSerie()" title="Ajouter la série" style="background:var(--grad);border:none;color:#fff;font-size:18px;width:40px;height:40px;border-radius:11px;flex-shrink:0">＋</button>
        </div>
        <div class="series-tags" id="series-tags"></div>
      </div>

      <div class="row2">
        <div class="field"><label>Type d'event</label>
          <select id="f-type">
            <option value="">— Choisir —</option>
            <option>Pop-up</option><option>Café collab</option><option>Event en ligne</option>
            <option>Vente physique</option><option>Festival</option><option>Autre</option>
          </select>
        </div>
        <div class="field"><label>Statut</label>
          <select id="f-statut">
            <option>À venir</option><option>En cours</option><option>Passé</option>
            <option>Annulé</option><option>Manqué</option>
          </select>
        </div>
      </div>

      <div class="row2">
        <div class="field"><label>Ville</label><input type="text" id="f-ville" placeholder="Séoul, Paris…"></div>
        <div class="field"><label>Pays</label>
          <input type="text" id="f-pays" placeholder="Corée du Sud, France…" list="pays-list">
          <datalist id="pays-list">
            <option>Corée du Sud</option><option>Japon</option><option>France</option>
            <option>Taïwan</option><option>Chine</option><option>États-Unis</option>
          </datalist>
        </div>
      </div>

      <div class="row2">
        <div class="field"><label>Date début</label><input type="date" id="f-date-debut"></div>
        <div class="field"><label>Date fin</label><input type="date" id="f-date-fin"></div>
      </div>

      <div class="field"><label>Lieu / Adresse</label><input type="text" id="f-lieu" placeholder="Hongdae, IFC Mall, en ligne…"></div>

      <div class="field"><label>Notes libres</label><textarea id="f-notes" placeholder="Réservation, merch disponible, expérience…"></textarea></div>

      <div class="field"><label>Lien (site, Twitter, Naver…)</label><input type="url" id="f-lien" placeholder="https://…"></div>

      <div style="display:flex;gap:10px;margin-top:6px">
        <button class="btn-primary" onclick="saveCollab()">💾 Enregistrer</button>
        <button class="btn-sm purple" style="padding:13px 18px;border-radius:13px" onclick="cancelEdit()">Annuler</button>
      </div>
    </div>
  </div>

  <!-- ══════════════════
       STATS
  ═══════════════════ -->
  <div id="tab-stats" class="tab-panel">
    <div id="stats-content"></div>
  </div>

</main>

<div class="toast" id="toast"></div>

<script>
// ── DATA ──────────────────────────────────────────────────────────────────
let collabs = [];
let currentSeries = []; // séries en cours de saisie dans le form

const STATUT_COLORS = {
  "À venir":  {bg:"#fbbf2420",color:"#fbbf24"},
  "En cours": {bg:"#34d39920",color:"#34d399"},
  "Passé":    {bg:"#6b689820",color:"#9d9bc0"},
  "Annulé":   {bg:"#f8717120",color:"#f87171"},
  "Manqué":   {bg:"#f9731620",color:"#f97316"},
};
const TYPE_COLORS = {
  "Pop-up":"#c084fc","Café collab":"#f472b6","Event en ligne":"#22d3ee",
  "Vente physique":"#34d399","Festival":"#fbbf24","Autre":"#9d9bc0"
};

function save() {
  try { localStorage.setItem("bl-collabs", JSON.stringify(collabs)); } catch(e){}
}
function load() {
  try { const d = localStorage.getItem("bl-collabs"); if(d) collabs = JSON.parse(d); } catch(e){ collabs=[]; }
}
function uid() { return Date.now().toString(36)+Math.random().toString(36).slice(2); }
function esc(s){ return String(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
function toast(msg){ const t=document.getElementById("toast"); t.textContent=msg; t.style.display="block"; setTimeout(()=>t.style.display="none",2500); }

function updateHeader() {
  const total = collabs.length;
  const series = getSeriesRanking();
  document.getElementById("hdr-sub").textContent = `${total} collab${total>1?"s":""} · ${series.length} série${series.length>1?"s":""} différente${series.length>1?"s":""}`;
  updatePaysFilter();
}

// ── SERIES TAGS ───────────────────────────────────────────────────────────
function addSerie() {
  const inp = document.getElementById("f-serie-input");
  const val = inp.value.trim();
  if (!val) return;
  if (!currentSeries.includes(val)) {
    currentSeries.push(val);
    renderTags();
  }
  inp.value = "";
  inp.focus();
}

function removeSerie(s) {
  currentSeries = currentSeries.filter(x => x !== s);
  renderTags();
}

function renderTags() {
  const wrap = document.getElementById("series-tags");
  if (!currentSeries.length) { wrap.innerHTML = `<span style="font-size:11px;color:var(--muted);font-style:italic">Aucune série ajoutée</span>`; return; }
  wrap.innerHTML = currentSeries.map(s =>
    `<span class="serie-tag">${esc(s)}<button onclick="removeSerie('${esc(s)}')" title="Supprimer">×</button></span>`
  ).join("");
}

// ── FORM ──────────────────────────────────────────────────────────────────
function openForm(id) {
  const c = id ? collabs.find(x=>x.id===id) : null;
  document.getElementById("form-title").textContent = c ? "Modifier la Collab" : "Nouvelle Collab";
  document.getElementById("f-id").value = c?.id || "";
  document.getElementById("f-nom").value = c?.nom || "";
  document.getElementById("f-orga").value = c?.orga || "";
  document.getElementById("f-type").value = c?.type || "";
  document.getElementById("f-statut").value = c?.statut || "À venir";
  document.getElementById("f-ville").value = c?.ville || "";
  document.getElementById("f-pays").value = c?.pays || "";
  document.getElementById("f-date-debut").value = c?.dateDebut || "";
  document.getElementById("f-date-fin").value = c?.dateFin || "";
  document.getElementById("f-lieu").value = c?.lieu || "";
  document.getElementById("f-notes").value = c?.notes || "";
  document.getElementById("f-lien").value = c?.lien || "";
  currentSeries = c?.series ? [...c.series] : [];
  renderTags();
  switchTab("form");
  document.getElementById("f-nom").focus();
}

function cancelEdit() {
  currentSeries = [];
  renderTags();
  switchTab("liste");
}

function saveCollab() {
  const nom = document.getElementById("f-nom").value.trim();
  if (!nom) { toast("⚠️ Le nom de la collab est requis !"); return; }
  if (!currentSeries.length) { toast("⚠️ Ajoute au moins une série !"); return; }

  const id = document.getElementById("f-id").value || uid();
  const entry = {
    id, nom,
    orga: document.getElementById("f-orga").value.trim(),
    series: [...currentSeries],
    type: document.getElementById("f-type").value,
    statut: document.getElementById("f-statut").value,
    ville: document.getElementById("f-ville").value.trim(),
    pays: document.getElementById("f-pays").value.trim(),
    dateDebut: document.getElementById("f-date-debut").value,
    dateFin: document.getElementById("f-date-fin").value,
    lieu: document.getElementById("f-lieu").value.trim(),
    notes: document.getElementById("f-notes").value.trim(),
    lien: document.getElementById("f-lien").value.trim(),
    createdAt: Date.now(),
  };

  const idx = collabs.findIndex(x=>x.id===id);
  if (idx>=0) collabs[idx]=entry; else collabs.push(entry);
  save();
  currentSeries = [];
  renderTags();
  toast("✅ Collab enregistrée !");
  switchTab("liste");
  renderListe();
  updateHeader();
}

function deleteCollab(id) {
  const c = collabs.find(x=>x.id===id);
  if (!c || !confirm(`Supprimer "${c.nom}" ?`)) return;
  collabs = collabs.filter(x=>x.id!==id);
  save(); renderListe(); renderStats(); updateHeader();
  toast("🗑️ Supprimée");
}

// ── LISTE ─────────────────────────────────────────────────────────────────
function getFiltered() {
  const search = document.getElementById("s-search").value.toLowerCase();
  const fType = document.getElementById("s-type").value;
  const fStatut = document.getElementById("s-statut").value;
  const fPays = document.getElementById("s-pays").value;
  const sort = document.getElementById("s-sort").value;

  let res = collabs.filter(c => {
    if (search) {
      const hay = [c.nom,c.orga,c.ville,c.pays,c.lieu,...(c.series||[])].join(" ").toLowerCase();
      if (!hay.includes(search)) return false;
    }
    if (fType && c.type !== fType) return false;
    if (fStatut && c.statut !== fStatut) return false;
    if (fPays && c.pays !== fPays) return false;
    return true;
  });

  res.sort((a,b) => {
    if (sort==="alpha") return (a.nom||"").localeCompare(b.nom||"");
    if (sort==="date_asc") return (a.dateDebut||"").localeCompare(b.dateDebut||"");
    return (b.dateDebut||"").localeCompare(a.dateDebut||"");
  });
  return res;
}

function updatePaysFilter() {
  const sel = document.getElementById("s-pays");
  const cur = sel.value;
  const pays = [...new Set(collabs.map(c=>c.pays).filter(Boolean))].sort();
  sel.innerHTML = `<option value="">Tous pays</option>${pays.map(p=>`<option${p===cur?" selected":""}>${esc(p)}</option>`).join("")}`;
}

function formatDate(d) {
  if (!d) return "";
  const [y,m,j] = d.split("-");
  return `${j}/${m}/${y}`;
}

function statusBadge(s) {
  const col = STATUT_COLORS[s] || {bg:"#ffffff10",color:"#ccc"};
  return `<span class="status-badge" style="background:${col.bg};color:${col.color}">${s}</span>`;
}

function collabCardHTML(c) {
  const seriesTags = (c.series||[]).map(s=>`<span class="stag">${esc(s)}</span>`).join("");
  const dateStr = c.dateDebut ? `${formatDate(c.dateDebut)}${c.dateFin&&c.dateFin!==c.dateDebut?" → "+formatDate(c.dateFin):""}` : "";
  const typeColor = TYPE_COLORS[c.type] || "#9d9bc0";

  return `<div class="collab-card">
    <div class="collab-header">
      <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-bottom:6px">
        <div>
          ${c.type?`<div style="font-size:10px;font-weight:800;color:${typeColor};text-transform:uppercase;letter-spacing:.06em;margin-bottom:3px">${esc(c.type)}</div>`:""}
          <div class="collab-name">${esc(c.nom)}</div>
        </div>
        ${statusBadge(c.statut)}
      </div>
      <div class="collab-series">${seriesTags}</div>
      <div class="meta-row">
        ${c.orga?`<div class="meta-chip">🏢 <span>${esc(c.orga)}</span></div>`:""}
        ${c.ville||c.pays?`<div class="meta-chip">📍 <span>${esc([c.ville,c.pays].filter(Boolean).join(", "))}</span></div>`:""}
        ${dateStr?`<div class="meta-chip">📅 <span>${dateStr}</span></div>`:""}
        ${(c.series||[]).length?`<div class="meta-chip">📚 <span>${c.series.length} série${c.series.length>1?"s":""}</span></div>`:""}
      </div>
      ${c.notes?`<div style="font-size:12px;color:var(--muted);background:var(--bg2);border-radius:9px;padding:8px 11px;margin-bottom:6px;white-space:pre-wrap">${esc(c.notes)}</div>`:""}
      ${c.lien?`<a href="${esc(c.lien)}" target="_blank" style="font-size:12px;color:var(--cyan);text-decoration:none">🔗 ${esc(c.lien)}</a>`:""}
    </div>
    <div class="collab-footer">
      <button class="btn-sm purple" onclick="openForm('${c.id}')">✏️ Modifier</button>
      <button class="btn-sm danger" onclick="deleteCollab('${c.id}')">🗑️ Supprimer</button>
    </div>
  </div>`;
}

function renderListe() {
  const el = document.getElementById("liste-content");
  const filtered = getFiltered();
  if (!filtered.length) {
    el.innerHTML = `<div class="empty"><div class="empty-icon">🎪</div><div>${collabs.length?"Aucun résultat.":"Aucune collab pour l'instant.<br>Ajoutes-en une !"}</div></div>`;
    return;
  }
  el.innerHTML = filtered.map(collabCardHTML).join("");
}

// ── STATS ─────────────────────────────────────────────────────────────────
function getSeriesRanking() {
  const counts = {};
  const orgas = {}; // par série : liste des orgas
  collabs.forEach(c => {
    (c.series||[]).forEach(s => {
      counts[s] = (counts[s]||0) + 1;
      if (!orgas[s]) orgas[s] = new Set();
      if (c.orga) orgas[s].add(c.orga);
    });
  });
  return Object.entries(counts)
    .sort((a,b) => b[1]-a[1])
    .map(([name,count]) => ({ name, count, orgas: [...(orgas[name]||[])] }));
}

function renderStats() {
  const el = document.getElementById("stats-content");
  const total = collabs.length;
  if (!total) {
    el.innerHTML = `<div class="empty"><div class="empty-icon">📊</div><div>Pas encore de données.</div></div>`;
    return;
  }

  const ranking = getSeriesRanking();
  const maxCount = ranking[0]?.count || 1;
  const totalSeries = ranking.length;
  const avgSeries = total > 0 ? (collabs.reduce((s,c)=>s+(c.series||[]).length,0)/total).toFixed(1) : 0;

  // Types
  const typeCounts = {};
  collabs.forEach(c => { if(c.type) typeCounts[c.type]=(typeCounts[c.type]||0)+1; });
  const typeEntries = Object.entries(typeCounts).sort((a,b)=>b[1]-a[1]);

  // Pays
  const paysCounts = {};
  collabs.forEach(c => { if(c.pays) paysCounts[c.pays]=(paysCounts[c.pays]||0)+1; });
  const paysEntries = Object.entries(paysCounts).sort((a,b)=>b[1]-a[1]);

  // Statuts
  const statutCounts = {};
  collabs.forEach(c => { statutCounts[c.statut]=(statutCounts[c.statut]||0)+1; });

  // Orgas
  const orgaCounts = {};
  collabs.forEach(c => { if(c.orga) orgaCounts[c.orga]=(orgaCounts[c.orga]||0)+1; });
  const orgaEntries = Object.entries(orgaCounts).sort((a,b)=>b[1]-a[1]).slice(0,5);

  // Timeline (collabs triées par date)
  const withDates = collabs.filter(c=>c.dateDebut).sort((a,b)=>b.dateDebut.localeCompare(a.dateDebut)).slice(0,8);

  const rankColors = ["#fbbf24","#9d9bc0","#f97316","#c084fc","#f472b6"];

  el.innerHTML = `
  <!-- KPIs -->
  <div class="stats-grid">
    <div class="stat-card" style="--accent:var(--grad)">
      <div class="stat-label">Total collabs</div>
      <div class="stat-value">${total}</div>
      <div class="stat-sub">${totalSeries} séries différentes</div>
    </div>
    <div class="stat-card" style="--accent:#fbbf24">
      <div class="stat-label">Séries différentes</div>
      <div class="stat-value">${totalSeries}</div>
      <div class="stat-sub">Moy. ${avgSeries} séries / collab</div>
    </div>
    <div class="stat-card" style="--accent:#34d399">
      <div class="stat-label">Série la + populaire</div>
      <div class="stat-value" style="font-size:16px;line-height:1.3">${ranking[0]?.name||"—"}</div>
      <div class="stat-sub">${ranking[0]?.count||0} collab${(ranking[0]?.count||0)>1?"s":""}</div>
    </div>
    <div class="stat-card" style="--accent:#f472b6">
      <div class="stat-label">Organisateur top</div>
      <div class="stat-value" style="font-size:16px;line-height:1.3">${orgaEntries[0]?.[0]||"—"}</div>
      <div class="stat-sub">${orgaEntries[0]?.[1]||0} collab${(orgaEntries[0]?.[1]||0)>1?"s":""}</div>
    </div>
  </div>

  <!-- RANKING SÉRIES -->
  <div class="section-title">🏆 Séries les plus populaires</div>
  ${ranking.length ? ranking.map((r,i) => `
    <div class="rank-row">
      <div class="rank-num" style="color:${rankColors[i]||"#6b6898"}">${i===0?"🥇":i===1?"🥈":i===2?"🥉":i+1}</div>
      <div style="flex:1;min-width:0">
        <div class="rank-name">${esc(r.name)}</div>
        ${r.orgas.length?`<div class="rank-orgas">via ${r.orgas.slice(0,3).map(o=>esc(o)).join(", ")}${r.orgas.length>3?" +"+( r.orgas.length-3):""}</div>`:""}
        <div class="rank-bar-wrap" style="margin-top:5px">
          <div class="rank-bar" style="width:${Math.round(r.count/maxCount*100)}%"></div>
        </div>
      </div>
      <div class="rank-count">${r.count}×</div>
    </div>
  `).join("") : "<div style='color:var(--muted);font-size:13px'>Aucune donnée.</div>"}

  <!-- TYPES -->
  ${typeEntries.length ? `<div class="section-title">🎭 Types d'events</div>
  ${typeEntries.map(([t,n]) => `
    <div class="type-row">
      <div class="type-label" style="color:${TYPE_COLORS[t]||"#ccc"}">${t}</div>
      <div class="type-bar-wrap">
        <div class="type-bar" style="width:${Math.round(n/total*100)}%;background:${TYPE_COLORS[t]||"#c084fc"}"></div>
      </div>
      <div class="type-count">${n}</div>
    </div>
  `).join("")}` : ""}

  <!-- PAYS -->
  ${paysEntries.length ? `<div class="section-title">🌏 Pays</div>
  <div style="display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px">
    ${paysEntries.map(([p,n]) => `
      <div style="background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:8px 13px;display:flex;align-items:center;gap:8px">
        <span style="font-size:13px;color:var(--text);font-weight:700">${esc(p)}</span>
        <span style="font-size:12px;color:var(--purple);font-weight:800">${n}</span>
      </div>
    `).join("")}
  </div>` : ""}

  <!-- ORGANISATEURS -->
  ${orgaEntries.length>1 ? `<div class="section-title">🏢 Organisateurs</div>
  ${orgaEntries.map(([o,n]) => `
    <div class="type-row">
      <div class="type-label">${esc(o)}</div>
      <div class="type-bar-wrap"><div class="type-bar" style="width:${Math.round(n/total*100)}%;background:#c084fc"></div></div>
      <div class="type-count">${n}</div>
    </div>
  `).join("")}` : ""}

  <!-- STATUTS -->
  <div class="section-title">📌 Statuts</div>
  <div style="display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px">
    ${Object.entries(statutCounts).map(([s,n]) => {
      const col = STATUT_COLORS[s]||{bg:"#ffffff10",color:"#ccc"};
      return `<div style="background:${col.bg};border:1px solid ${col.color}44;border-radius:10px;padding:7px 13px;display:flex;align-items:center;gap:8px">
        <span style="font-size:12px;font-weight:800;color:${col.color}">${s}</span>
        <span style="font-size:14px;font-weight:800;color:#fff">${n}</span>
      </div>`;
    }).join("")}
  </div>

  <!-- TIMELINE RÉCENTE -->
  ${withDates.length ? `<div class="section-title">📅 Timeline récente</div>
  ${withDates.map(c => `
    <div class="timeline-row">
      <div class="tl-dot" style="background:${STATUT_COLORS[c.statut]?.color||"#c084fc"}"></div>
      <div class="tl-body">
        <div class="tl-name">${esc(c.nom)}</div>
        <div class="tl-meta">${formatDate(c.dateDebut)}${c.ville?" · "+esc(c.ville):""}${c.orga?" · "+esc(c.orga):""}</div>
        <div class="tl-series">${(c.series||[]).map(s=>`<span class="stag" style="background:#c084fc18;border:1px solid #c084fc33;border-radius:12px;padding:2px 8px;font-size:10px;font-weight:700;color:var(--purple)">${esc(s)}</span>`).join("")}</div>
      </div>
    </div>
  `).join("")}` : ""}
  `;
}

// ── NAVIGATION ────────────────────────────────────────────────────────────
function switchTab(name) {
  document.querySelectorAll(".tab-panel").forEach(p=>p.classList.remove("active"));
  document.querySelectorAll(".tab-btn").forEach(b=>b.classList.toggle("active",b.dataset.tab===name));
  document.getElementById("tab-"+name).classList.add("active");
  if (name==="stats") renderStats();
  if (name==="liste") renderListe();
}
document.querySelectorAll(".tab-btn").forEach(b=>b.addEventListener("click",()=>switchTab(b.dataset.tab)));

// ── EXPORT / IMPORT ───────────────────────────────────────────────────────
function exportJSON() {
  const blob = new Blob([JSON.stringify(collabs,null,2)],{type:"application/json"});
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download="bl-collabs.json"; a.click();
}
function importJSON(inp) {
  const file=inp.files[0]; if(!file) return;
  const r=new FileReader();
  r.onload=e=>{
    try {
      const data=JSON.parse(e.target.result);
      if(!Array.isArray(data)) throw new Error();
      const existing=new Set(collabs.map(c=>c.id));
      const newOnes=data.filter(c=>!existing.has(c.id));
      collabs=[...collabs,...newOnes]; save(); renderListe(); updateHeader();
      toast(`✅ ${newOnes.length} collab(s) importée(s)`);
    } catch{ toast("❌ Fichier JSON invalide"); }
    inp.value="";
  };
  r.readAsText(file);
}

const CSV_FIELDS = ["id","nom","orga","series","type","statut","ville","pays","dateDebut","dateFin","lieu","notes","lien"];
function escCSV(v){ const s=Array.isArray(v)?v.join("|"):String(v||""); return (s.includes(",")||s.includes('"')||s.includes("\n"))?`"${s.replace(/"/g,'""')}"`:s; }

function exportCSV() {
  const rows = collabs.map(c=>CSV_FIELDS.map(f=>escCSV(c[f])).join(","));
  const csv = [CSV_FIELDS.join(","),...rows].join("\n");
  const blob=new Blob(["\uFEFF"+csv],{type:"text/csv;charset=utf-8;"}); 
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download="bl-collabs.csv"; a.click();
}
function importCSV(inp) {
  const file=inp.files[0]; if(!file) return;
  const r=new FileReader();
  r.onload=e=>{
    const lines=e.target.result.split(/\r?\n/).filter(l=>l.trim());
    if(lines.length<2){toast("❌ CSV invalide");return;}
    const headers=lines[0].split(",");
    const parsed=[];
    for(let i=1;i<lines.length;i++){
      const cols=[];let cur="",inQ=false;
      for(let c=0;c<lines[i].length;c++){const ch=lines[i][c];if(ch==='"'){inQ=!inQ;}else if(ch===','&&!inQ){cols.push(cur);cur="";}else{cur+=ch;}}
      cols.push(cur);
      const obj={};
      headers.forEach((h,idx)=>{
        const v=(cols[idx]||"").replace(/^"|"$/g,"").replace(/""/g,'"');
        obj[h]=h==="series"?v.split("|").filter(Boolean):v;
      });
      if(obj.nom) parsed.push({...obj,id:obj.id||uid()});
    }
    const existing=new Set(collabs.map(c=>c.id));
    const newOnes=parsed.filter(c=>!existing.has(c.id));
    collabs=[...collabs,...newOnes]; save(); renderListe(); updateHeader();
    toast(`✅ ${newOnes.length} collab(s) importée(s)`); inp.value="";
  };
  r.readAsText(file,"utf-8");
}

// ── INIT ──────────────────────────────────────────────────────────────────
load();
renderTags();
renderListe();
updateHeader();
</script>
<script>
if ('serviceWorker' in navigator) {
  const sw = `
const CACHE='bl-collabs-pwa-v1';
const URLS=['/'];
self.addEventListener('install',e=>{e.waitUntil(caches.open(CACHE).then(c=>c.addAll(URLS)));self.skipWaiting();});
self.addEventListener('activate',e=>{e.waitUntil(caches.keys().then(ks=>Promise.all(ks.filter(k=>k!==CACHE).map(k=>caches.delete(k)))));self.clients.claim();});
self.addEventListener('fetch',e=>{if(e.request.method!=='GET')return;e.respondWith(caches.match(e.request).then(r=>r||fetch(e.request).catch(()=>caches.match('/'))));}); `;
  const blob = new Blob([sw], {type:'application/javascript'});
  const url = URL.createObjectURL(blob);
  navigator.serviceWorker.register(url);
}
</script>
